<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FIS111 Control 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: a single "video player" — 1280x720 stage scaled to fit, captions + chapters below. Single deliberate dark look. */
:root{
  --bg:#060608; --bg2:#0d0d12; --bg3:#15151c; --grid:rgba(190,185,255,.05);
  --line:#7d7b88; --line2:#44434d; --ink:#eeedf3; --dim:#9a98a6; --faint:#5e5c68;
  --acc:#b48cff; --acc-soft:rgba(180,140,255,.12);
  --peso:#57d4c2; --normal:#eeedf3; --roce:#ff6b7d; --ten:#b48cff; --ela:#f4b55c; --acel:#ff8fd0; --vel:#8fc7ff;
  --K:#b48cff; --Ug:#57d4c2; --Ue:#f4b55c; --mom:#f4b55c; --imp:#ff8fd0; --A:#8fc7ff; --B:#ff6b7d; --C:#57d4c2;
  --f-disp:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --f-math:'STIX Two Text','Cambria Math',Cambria,Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.top h1{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:clamp(22px,3.2vw,32px);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.top p{margin:0;color:var(--dim);font-size:14px;font-family:var(--f-mono)}

#player{background:#000;border-radius:14px;overflow:hidden;border:1px solid #1c1b23;position:relative}
#player:fullscreen{border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;background:#000}
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg);margin:0 auto;max-width:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%),
    linear-gradient(var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    var(--bg);
  animation:drift 90s linear infinite}
@keyframes drift{to{background-position:0 0,0 80px,80px 0,0 0}}
.mark{position:absolute;right:26px;bottom:20px;font-family:var(--f-mono);font-size:15px;letter-spacing:.12em;color:var(--faint);z-index:5}

#big{position:absolute;inset:0;margin:auto;width:116px;height:116px;border-radius:50%;border:2px solid var(--acc);background:rgba(10,8,16,.75);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:6;box-shadow:0 0 60px rgba(180,140,255,.35);transition:transform .2s}
#big:hover{transform:scale(1.06)}
#big svg{width:44px;height:44px;margin-left:6px}
#resume{position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:7;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#resume button{font:600 14px var(--f-body);color:var(--ink);background:rgba(20,18,28,.92);border:1px solid var(--acc);border-radius:999px;padding:8px 14px;cursor:pointer}
#resume button+button{border-color:#2d2c36;color:var(--dim)}

#ctl{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px;background:#000}
#bar{position:relative;height:20px;cursor:pointer;touch-action:none;outline:none}
#bar .tr{position:absolute;left:0;right:0;top:8px;height:4px;background:#2a2932;border-radius:2px}
#bar .fill{position:absolute;left:0;top:8px;height:4px;background:var(--acc);border-radius:2px;width:0}
#bar .knob{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;translate:-50% 0;left:0;box-shadow:0 0 0 3px rgba(180,140,255,.35)}
#bar .tick{position:absolute;top:8px;width:3px;height:4px;background:#000;translate:-50% 0}
#bar:focus-visible .tr{outline:2px solid var(--acc);outline-offset:4px}
#tip{position:absolute;bottom:22px;translate:-50% 0;background:#16151d;border:1px solid #2d2c36;color:var(--ink);font:500 12px var(--f-body);padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
button.ic{background:none;border:0;color:var(--ink);width:40px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
button.ic svg{width:22px;height:22px}
button.ic:hover{background:#1a1a21}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#time{font-family:var(--f-mono);font-size:13px;color:var(--dim);margin:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#chName{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 120px}
button.tx{font:600 13px var(--f-mono);color:var(--ink);background:#15151b;border:1px solid #2a2930;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button.tx[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
button.tx:disabled{opacity:.45;cursor:not-allowed}
#cap{padding:16px 20px 18px;background:var(--bg2);border-top:1px solid #1c1b23;min-height:118px}
#cap .ct{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#cap .cx{font-size:clamp(16px,2.1vw,20px);line-height:1.55;color:var(--ink);max-width:78ch;text-wrap:pretty}
#player:fullscreen #cap{min-height:0}

section h3{font-family:var(--f-disp);font-stretch:110%;font-weight:800;font-size:20px;margin:6px 0 10px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.chs button{text-align:left;background:var(--bg2);border:1px solid #1d1c25;border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-width:0}
.chs button:hover{border-color:#34333e}
.chs button.on{border-color:var(--acc);background:#120f1b}
.chs .n{font-family:var(--f-mono);color:var(--faint);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.chs .t{font-weight:600;font-size:15px;display:block}
.chs .s{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.keys{color:var(--dim);font-size:13px;margin:0}
kbd,.kb{font-family:var(--f-mono);font-size:.85em;border:1px solid #34333e;border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#14141a;color:var(--ink)}

.vc{position:relative;display:inline-block}
.vc::before{content:'';position:absolute;left:12%;right:2%;top:-.06em;height:.08em;background:currentColor;border-radius:1px}
.vc::after{content:'';position:absolute;right:-.06em;top:-.2em;border-left:.24em solid currentColor;border-top:.14em solid transparent;border-bottom:.14em solid transparent}
.tagx{position:absolute;font-family:var(--f-mono);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.art .ttl{font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;fill:var(--dim)}
[hidden]{display:none!important}
/* ===== stage content ===== */
.scene{position:absolute;inset:0;transition:opacity .75s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .75s ease}
.scene.pre{opacity:0;transform:scale(1.04) translateY(10px);filter:blur(10px)}
.scene.out{opacity:0;transform:scale(.97);filter:blur(8px);pointer-events:none}
.scene svg.art{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.hdr{position:absolute;left:64px;top:42px;right:64px}
.hdr .tag{font-family:var(--f-mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hdr h2{font-family:var(--f-disp);font-stretch:115%;font-weight:800;font-size:42px;margin:6px 0 0;letter-spacing:-.01em;color:var(--ink);line-height:1.1}

.eq{position:absolute;font-family:var(--f-math);font-size:36px;color:var(--ink);white-space:nowrap;line-height:1.25}
.eq i{font-style:italic}
.eq .w{font-family:var(--f-body);font-style:normal;font-size:.68em;color:var(--dim);letter-spacing:.01em}
.eq sub{font-size:.6em;vertical-align:-.3em;line-height:0;font-style:normal}
.eq sup{font-size:.6em;vertical-align:.62em;line-height:0}
.eq.s{font-size:30px}.eq.xs{font-size:25px}.eq.l{font-size:50px}.eq.xl{font-size:70px}
.eq.dim{color:var(--dim)}.eq.acc{color:var(--acc)}
.eq.box{border:2px solid var(--acc);border-radius:10px;padding:6px 18px;background:rgba(180,140,255,.07);box-shadow:0 0 40px rgba(180,140,255,.16)}
.c{translate:-50% 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.08;font-size:.9em}
.fr>span:first-child{border-bottom:.055em solid currentColor;padding:0 .22em .05em}
.fr>span:last-child{padding:.05em .22em 0}
.rt{white-space:nowrap}
.rt>.rad{border-top:.055em solid currentColor;padding:.04em .12em 0;margin-left:.03em;display:inline-block;line-height:1.15}
.unit{font-style:normal;color:var(--dim)}
.eq .hl,.eq.hl{color:var(--acc);text-shadow:0 0 24px rgba(180,140,255,.7)}
.nt{position:absolute;font-family:var(--f-body);font-size:26px;line-height:1.38;color:var(--dim);white-space:normal}
.nt b{color:var(--ink);font-weight:600}
.nt.acc{color:var(--acc)}
.nt i{font-family:var(--f-math)}
.pill.nc{text-transform:none;letter-spacing:.02em;font-size:18px}
.pill{position:absolute;font-family:var(--f-mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:7px 15px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.panel{position:absolute;border:1.5px solid var(--line2);border-radius:14px;background:rgba(16,16,22,.72)}
.node{position:absolute;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:14px 18px;background:rgba(12,12,18,.9);font-family:var(--f-disp);font-stretch:108%;font-weight:700;font-size:27px;color:var(--ink);line-height:1.1}
.node small{display:block;font-family:var(--f-math);font-weight:400;font-size:22px;color:var(--dim);margin-top:6px}
.node small i{font-style:italic}.node small sub{font-size:.65em}
.node.acc{border-color:var(--acc);box-shadow:0 0 30px rgba(180,140,255,.18)}
.li{position:absolute;display:flex;gap:18px;align-items:baseline;font-size:28px;line-height:1.35;color:var(--dim);font-family:var(--f-body)}
.li .num{font-family:var(--f-mono);font-size:19px;color:var(--acc);border:1.5px solid var(--acc);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none;transform:translateY(-3px)}
.li b{color:var(--ink);font-weight:600}
.li i{font-family:var(--f-math)}
.hk{position:absolute;font-family:var(--f-mono);font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.hero{position:absolute;font-family:var(--f-disp);font-weight:900;font-stretch:112%;font-size:128px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.hsub{position:absolute;font-family:var(--f-body);font-size:31px;color:var(--dim)}
.card .cnum{position:absolute;left:140px;top:150px;font-family:var(--f-disp);font-weight:900;font-stretch:125%;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--line)}
.card .csub{position:absolute;left:146px;top:338px;font-family:var(--f-mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.card .cttl{position:absolute;left:140px;top:372px;font-family:var(--f-disp);font-weight:800;font-stretch:116%;font-size:82px;letter-spacing:-.015em;line-height:1.02;color:var(--ink);max-width:1000px}

/* svg drawing */
.art .ln{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .ln2{stroke:var(--line2);stroke-width:2.2;fill:none}
.art .dashl{stroke-dasharray:7 9}
.art .obj{fill:#111117;stroke:#a19faa;stroke-width:3}
.art .spr{fill:none;stroke:#cfcdd8;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.art .hatch{stroke:var(--line2);stroke-width:2}
.art text{font-family:var(--f-math);font-size:30px;fill:var(--ink)}
.art .lab{font-style:italic}
.art .sm{font-family:var(--f-body);font-size:22px;fill:var(--dim)}
.art .smacc{font-family:var(--f-body);font-size:22px;fill:var(--acc)}
.art .arr line{stroke:currentColor;stroke-width:4.5;stroke-linecap:round}
.art .arr polygon{fill:currentColor}
.art .arr text{fill:currentColor;font-style:italic;font-size:29px;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .dim line{stroke:var(--dim);stroke-width:1.6}
.art .dim text{fill:var(--dim);font-size:25px;font-style:italic;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .ang path{fill:none;stroke:var(--acc);stroke-width:2.2}
.art .ang text{fill:var(--acc);font-size:26px;font-style:italic}
.art .dot{fill:var(--ink)}

/* bars (energy diagrams) */
.bars{position:absolute;width:210px;font-family:var(--f-math)}
.btl{font-family:var(--f-disp);font-weight:800;font-stretch:110%;font-size:26px;text-align:center;margin-bottom:6px;color:var(--ink)}
.bcols{height:200px;display:flex;align-items:flex-end;justify-content:center;gap:12px;border-bottom:2px solid var(--line)}
.bc{width:50px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bf{width:100%;height:calc(var(--h,0) * 100%);border-radius:4px 4px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 26px -6px currentColor}
.bv{font-size:20px;color:var(--ink);margin-bottom:4px;white-space:nowrap;min-height:24px}
.bls{display:flex;justify-content:center;gap:12px;margin-top:6px}
.bls span{width:50px;text-align:center;font-style:italic;font-size:23px;color:var(--dim)}
.bls sub{font-size:.62em;font-style:normal}
.be{text-align:center;font-size:21px;margin-top:4px;color:var(--ink);min-height:28px;white-space:nowrap}
.be i{font-style:italic}.be sub{font-size:.6em;font-style:normal}.be sup{font-size:.6em}
.bars.sm .bcols{height:130px}.bars.sm .bc{width:42px}.bars.sm .bls span{width:42px}.bars.sm .btl{font-size:22px}

/* beat-driven visibility */
.scene [data-b]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .4s ease,color .4s ease}
.scene [data-b].vis{opacity:1;transform:none}
.scene .draw[data-b]{opacity:1;transform:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1),opacity .5s ease}
.scene .draw[data-b].vis{stroke-dashoffset:0}
.scene .gone,.scene .draw.gone{opacity:0!important}
.scene g.hl,.scene .node.hl,.scene .pill.hl{filter:drop-shadow(0 0 12px rgba(180,140,255,.8))}
@media (prefers-reduced-motion:reduce){
  #stage{animation:none}
  .scene,.scene [data-b]{transition-duration:.01s!important}
}
@media (max-width:560px){
  #cap{padding:12px 14px 14px}
  #chName{display:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="kick">FIS111 · Física General Mecánica</div><h1>Control 4: Momento lineal, la clase completa</h1></div>
    <p id="dur"></p>
  </header>

  <div id="player">
    <div id="frame">
      <div id="stage"></div>
      <div class="mark">FIS111</div>
      <button id="big" aria-label="Reproducir la clase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      <div id="resume" hidden><button id="bRes"></button><button id="bRes0">Desde el inicio</button></div>
    </div>
    <div id="ctl">
      <div id="bar" tabindex="0" role="slider" aria-label="Progreso de la clase" aria-valuemin="0"><div class="tr"></div><div class="fill"></div><div class="knob"></div><div id="tip" hidden></div></div>
      <div class="row">
        <button class="ic" id="bPrev" aria-label="Paso anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ic" id="bPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" fill="currentColor"><path id="icPlay" d="M7 4.5v15l12-7.5z"/></svg></button>
        <button class="ic" id="bNext" aria-label="Paso siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <span id="time">0:00 / 0:00</span>
        <span id="chName"></span>
        <button class="tx" id="bVoice" aria-pressed="false" title="Narración con la voz del navegador">Voz: no</button>
        <button class="tx" id="bSpeed" title="Velocidad">1×</button>
        <button class="ic" id="bFs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div id="cap"><div class="ct" id="capTag"></div><div class="cx" id="capTx"></div></div>
  </div>

  <section>
    <h3>Capítulos</h3>
    <div class="chs" id="chs"></div>
  </section>
  <p class="keys">Atajos: <kbd>Espacio</kbd> pausa · <kbd>←</kbd> <kbd>→</kbd> paso anterior o siguiente · <kbd>F</kbd> pantalla completa. Los subtítulos son la narración completa; la voz es opcional.</p>
</div>

<script>
/* ================= helpers: math text ================= */
function fr(a,b){return `<span class="fr"><span>${a}</span><span>${b}</span></span>`}
function rt(x){return `<span class="rt">√<span class="rad">${x}</span></span>`}
function M(s){
  const keep=[];const K=h=>{keep.push(h);return '\u0001'+(keep.length-1)+'\u0001'};
  s=s.replace(/\{\{(.*?)\}\}/g,(_,a)=>K(`<span class="w">${a}</span>`))
     .replace(/\[([^\]]+)\]/g,(_,a)=>K(`<span class="unit">${a.replace(/\^(\d)/g,'<sup>$1</sup>')}</span>`))
     .replace(/_\{([^}]*)\}/g,(_,a)=>K(`<sub>${a}</sub>`))
     .replace(/_([A-Za-z0-9áéíóú]+)/g,(_,a)=>K(`<sub>${a}</sub>`))
     .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^([0-9]+)/g,'<sup>$1</sup>');
  s=s.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/(^|[^A-Za-zÀ-ÿ\u0001])([A-Za-zμωθαδφ])(?![A-Za-zÀ-ÿ])/g,'$1<i>$2</i>')).join('');
  return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>keep[+i]);
}
/* ================= helpers: beat attrs ================= */
function ab(b){if(b==null||b===false)return '';if(typeof b!=='object')return ` data-b="${b}"`;let s='';if(b.b!=null)s+=` data-b="${b.b}"`;if(b.x!=null)s+=` data-x="${b.x}"`;if(b.d!=null)s+=` data-d="${b.d}"`;if(b.hl!=null)s+=` data-hl="${b.hl}"`;return s}
const hasB=b=>b!=null&&b!==false&&(typeof b!=='object'||b.b!=null);
/* ================= helpers: html ================= */
function Q(x,y,s,b,cls=''){return `<div class="eq ${cls}" style="left:${x}px;top:${y}px"${ab(b)}>${M(s)}</div>`}
function N(x,y,w,s,b,cls=''){return `<div class="nt ${cls}" style="left:${x}px;top:${y}px;width:${w}px"${ab(b)}>${s}</div>`}
function P(x,y,s,col,b,c=''){return `<div class="pill ${c}" style="left:${x}px;top:${y}px;color:var(--${col})"${ab(b)}>${s}</div>`}
function LI(x,y,n,s,b,w=1080){return `<div class="li" style="left:${x}px;top:${y}px;width:${w}px"${ab(b)}><span class="num">${n}</span><span>${s}</span></div>`}
function node(x,y,w,t,s,b,cls=''){return `<div class="node ${cls}" style="left:${x}px;top:${y}px;width:${w}px"${ab(b)}>${t}<small>${M(s)}</small></div>`}
function svg(s){return `<svg class="art" viewBox="0 0 1280 720">${s}</svg>`}
function bars(id,x,y,t,b,cls=''){return `<div class="bars ${cls}" id="${id}" style="left:${x}px;top:${y}px"${ab(b)}><div class="btl">${t}</div><div class="bcols">${['K','Ug','Ue'].map(k=>`<div class="bc"><span class="bv"></span><div class="bf" style="background:var(--${k});color:var(--${k})"></div></div>`).join('')}</div><div class="bls"><span>K</span><span>U<sub>g</sub></span><span>U<sub>e</sub></span></div><div class="be"></div></div>`}
function setB(r,id,v,lab,e){const el=r.querySelector('#'+id);if(!el)return;el.querySelectorAll('.bc').forEach((c,i)=>{c.style.setProperty('--h',v[i]||0);c.querySelector('.bv').textContent=lab&&lab[i]!=null?lab[i]:''});el.querySelector('.be').innerHTML=e?M(e):''}
/* ================= helpers: svg ================= */
const sb=s=>`<tspan font-size="19" dy="7" font-style="normal">${s}</tspan>`;
function ln(x1,y1,x2,y2,b,c='ln',st=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${st?` style="${st}"`:''}${ab(b)}/>`}
function pth(d,b,c='ln',st=''){return `<path d="${d}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${st?` style="${st}"`:''}${ab(b)}/>`}
function cir(cx,cy,r,b,c='ln'){return `<circle cx="${cx}" cy="${cy}" r="${r}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${ab(b)}/>`}
function dot(x,y,b,r=6){return `<circle cx="${x}" cy="${y}" r="${r}" class="dot"${ab(b)}/>`}
function tx(x,y,s,b,cls='',anc='middle'){return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="central" class="${cls}"${ab(b)}>${s}</text>`}
function ageo(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),h=17,w=.42;return{a,ex:x2-Math.cos(a)*h*.6,ey:y2-Math.sin(a)*h*.6,pts:`${x2},${y2} ${x2-h*Math.cos(a-w)},${y2-h*Math.sin(a-w)} ${x2-h*Math.cos(a+w)},${y2-h*Math.sin(a+w)}`,lx:x2+Math.cos(a)*26,ly:y2+Math.sin(a)*26}}
function arr(x1,y1,x2,y2,col,lab,b,lp,st=''){const g=ageo(x1,y1,x2,y2);const [lx,ly]=lp||[g.lx,g.ly];return `<g class="arr" style="color:var(--${col});${st}"${ab(b)}><line x1="${x1}" y1="${y1}" x2="${g.ex}" y2="${g.ey}"/><polygon points="${g.pts}"/>${lab?`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function darr(id,col,lab,b){return `<g class="arr" id="${id}" style="color:var(--${col})"${ab(b)}><line/><polygon/>${lab?`<text text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function setArr(r,id,x1,y1,x2,y2,lp){const e=r.querySelector('#'+id);if(!e)return;const g=ageo(x1,y1,x2,y2);const l=e.querySelector('line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',g.ex);l.setAttribute('y2',g.ey);e.querySelector('polygon').setAttribute('points',g.pts);const t=e.querySelector('text');if(t){const p=lp||[g.lx,g.ly];t.setAttribute('x',p[0]);t.setAttribute('y',p[1])}}
function blk(x,y,w,h,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" class="obj"/>${lab?tx(x+w/2,y+h/2,lab,null,'lab'):''}</g>`}
function ball(x,y,r,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><circle cx="${x}" cy="${y}" r="${r}" class="obj"/>${lab?tx(x,y,lab,null,'lab'):''}</g>`}
function gnd(x1,x2,y,b,red){let h='';for(let x=x1+12;x<=x2;x+=22)h+=`<line x1="${x}" y1="${y+2}" x2="${x-12}" y2="${y+15}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="ln"${red?' style="stroke:var(--roce)"':''}/>${h}</g>`}
function wall(x,y1,y2,b,side=-1){let h='';for(let y=y1+10;y<=y2;y+=20)h+=`<line x1="${x}" y1="${y}" x2="${x+side*13}" y2="${y+10}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="ln"/>${h}</g>`}
function ceil(x1,x2,y,b){let h='';for(let x=x1+12;x<=x2;x+=22)h+=`<line x1="${x}" y1="${y-2}" x2="${x-12}" y2="${y-15}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="ln"/>${h}</g>`}
function springPts(x1,y1,x2,y2,n=9,w=15){const L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy,ny=ux,lead=Math.min(16,L*.12);const p=[[x1,y1],[x1+ux*lead,y1+uy*lead]];const m=2*n;for(let i=0;i<m;i++){const s=lead+(L-2*lead)*(i+.5)/m,sd=(i%2?-1:1)*w;p.push([x1+ux*s+nx*sd,y1+uy*s+ny*sd])}p.push([x2-ux*lead,y2-uy*lead],[x2,y2]);return p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}
function spr(id,x1,y1,x2,y2,b,n,w){return `<polyline${id?` id="${id}"`:''} class="spr" points="${springPts(x1,y1,x2,y2,n,w)}"${ab(b)}/>`}
function setSpr(r,id,x1,y1,x2,y2,n,w){const e=r.querySelector('#'+id);if(e)e.setAttribute('points',springPts(x1,y1,x2,y2,n,w))}
function dim(x1,y1,x2,y2,lab,b,lx,ly){const a=Math.atan2(y2-y1,x2-x1),nx=-Math.sin(a)*9,ny=Math.cos(a)*9;return `<g class="dim"${ab(b)}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x1+nx}" y2="${y1+ny}"/><line x1="${x2-nx}" y1="${y2-ny}" x2="${x2+nx}" y2="${y2+ny}"/>${lab?`<text x="${lx??(x1+x2)/2}" y="${ly??(y1+y2)/2}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function arc(cx,cy,r,a1,a2,lab,b,lr){lr=lr??r+24;const R=Math.PI/180,P=a=>[cx+r*Math.cos(a*R),cy-r*Math.sin(a*R)];const [x1,y1]=P(a1),[x2,y2]=P(a2);const lg=Math.abs(a2-a1)>180?1:0,sw=a2>a1?0:1,am=(a1+a2)/2*R;return `<g class="ang"${ab(b)}><path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${lg} ${sw} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>${lab?`<text x="${(cx+lr*Math.cos(am)).toFixed(1)}" y="${(cy-lr*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
/* ================= helpers: motion ================= */
function pick(j,o){let v;for(const k of Object.keys(o).map(Number).sort((a,b)=>a-b))if(k<=j)v=o[k];return v}
function tween(r,key,dur,fn){r._tw=r._tw||{};const id={};r._tw[key]=id;const t0=performance.now();const e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;function st(now){if(r._tw[key]!==id)return;const p=Math.min(1,(now-t0)/(dur*1000));fn(e(p));if(p<1)requestAnimationFrame(st)}requestAnimationFrame(st)}
function animv(r,key,to,dur,fn,instant){r._v=r._v||{};const from=r._v[key];r._v[key]=to;if(instant||from==null){fn(to);return}const isA=Array.isArray(to);tween(r,key,dur,p=>fn(isA?to.map((v,i)=>from[i]+(v-from[i])*p):from+(to-from)*p))}
function setT(r,id,x,y){const e=r.querySelector('#'+id);if(e)e.setAttribute('transform',`translate(${x},${y})`)}

/* ================= content registry ================= */
const CHS=[],SC=[];let _ch=null;
function CH(title,sub,narr){_ch={title,sub,scenes:[],i:CHS.length};CHS.push(_ch);if(narr)S({card:true,title,beats:[narr]})}

/* car drawn with bottom-center at (0,0); facing right */
function carG(w,col,lab){const h=w*.3;return `<rect x="${-w/2}" y="${-h-w*.1}" width="${w}" height="${h}" rx="8" style="fill:#101016;stroke:var(--${col});stroke-width:3.5"/><path d="M${-w*.28} ${-h-w*.1} L${-w*.18} ${-h-w*.3} L${w*.16} ${-h-w*.3} L${w*.3} ${-h-w*.1}" style="fill:#101016;stroke:var(--${col});stroke-width:3"/><circle cx="${-w*.28}" cy="${-w*.1}" r="${w*.1}" class="obj"/><circle cx="${w*.28}" cy="${-w*.1}" r="${w*.1}" class="obj"/>${lab?`<text x="0" y="${-h/2-w*.1}" text-anchor="middle" dominant-baseline="central" style="fill:var(--${col});font-family:var(--f-body);font-size:${Math.round(w*.15)}px">${lab}</text>`:''}`}

function axesG(x,y,L,b,lx='î',ly='ĵ'){return `<g${ab(b)}>${arr(x,y,x+L,y,'dim','')}${arr(x,y,x,y-L,'dim','')}${tx(x+L+22,y,lx,null,'lab')}${tx(x,y-L-22,ly,null,'lab')}</g>`}
function kf(t,P){if(t<=P[0][0])return P[0][1];for(let i=1;i<P.length;i++){if(t<=P[i][0]){const a=P[i-1],b=P[i],u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*u}}return P[P.length-1][1]}
/* 1D position: contact at time tc at xc, speed before vb, after va (px/s) */

<path d="M780 558 C 880 556, 905 230, 960 230 S 1040 556, 1140 558 Z" style="fill:rgba(255,143,208,.18);stroke:var(--imp);stroke-width:4"/>
${tx(960,470,'misma área',null,'lab')}${tx(960,620,'un choque real',null,'sm')}</g>`)}
${Q(150,615,'I = ΣF Δt',2,'l box')}
${N(470,630,260,'Unidad: N·s',2)}`,
beats:[
`Grafiquemos la fuerza contra el tiempo. Si la fuerza es constante, el gráfico es una línea horizontal, a la altura F, desde t igual a cero hasta el tiempo final.`,
`El área bajo esa línea es un rectángulo. La base es delta t y la altura es F, así que el área es F por delta t. Y acabamos de ver que eso es igual a m por delta v. El área bajo el gráfico es justo el efecto de la fuerza.`,
`Esa área tiene nombre: se llama impulso, y se escribe con la letra I mayúscula. El impulso es la fuerza neta por el tiempo que actúa. Su unidad es el newton por segundo.`,
`En un choque real la fuerza no es constante. Sube muy rápido, llega a un máximo y baja muy rápido, como esta curva. Pero la idea es la misma: el impulso es el área bajo la curva. Por eso un golpe muy corto pero muy fuerte puede tener el mismo impulso que un empujón largo y suave.`]
});

S({title:'Nace el momento lineal',
html:`
${Q(90,180,'ΣF Δt = m Δv',0,'l dim')}
${Q(90,270,'ΣF Δt = m (v_f − v_i)',0,'l')}
${Q(90,360,'ΣF Δt = <span data-hl="1,2">m v_f</span> − <span data-hl="1,2">m v_i</span>',1,'l')}
${Q(760,200,'p = m v',2,'xl box')}
${N(760,330,440,'Momento lineal o <b>cantidad de movimiento</b>.',2)}
${Q(760,420,'[kg·m/s] = [N·s]',3,'s')}
${Q(90,500,'I = p_f − p_i = Δp',4,'xl box')}`,
beats:[
`Volvamos a la ecuación: fuerza neta por delta t igual a m por delta v. Abramos el delta v: es la velocidad final menos la velocidad inicial. Entonces queda m por, v final menos v inicial.`,
`Ahora repartimos la m, multiplicando cada término: m por v final, menos m por v inicial. Fíjate que aparece dos veces la misma combinación: masa por velocidad.`,
`A esa combinación le damos un nombre: momento lineal, también llamado cantidad de movimiento. Se escribe con la letra p minúscula. p es igual a m por v. Es la definición más importante del control.`,
`Sus unidades salen solas: kilogramos por metros por segundo. Y un dato útil: un newton por segundo es exactamente lo mismo que un kilogramo metro por segundo. Así que el impulso y el momento se miden en lo mismo.`,
`Con este nombre, la ecuación queda muy simple: el impulso es p final menos p inicial. O sea, el impulso es el cambio de momento. Esta frase vale oro: el impulso causa un cambio de momento.`]
});

S({title:'El momento es un vector',
html:`${svg(`
${axesG(120,560,120,0)}
${gnd(260,700,470,0)}
${cball(330,436,34,'A','',1)}
${tx(330,515,'m = 1,5 kg',1,'sm')}
${arr(380,436,520,436,'vel','v',1,[560,436])}
${arr(330,360,660,360,'mom','p',3,[690,360])}`)}

${Q(760,300,'v = 2,0 î [m/s]',1,'s')}
${Q(760,380,`${vc('p')} = m ${vc('v')} = 1,5 · 2,0 î`,2,'s')}
${Q(760,450,`${vc('p')} = 3,0 î [kg·m/s]`,3,'s box')}
${N(760,560,450,'El <b>impulso</b> apunta como el cambio de velocidad: igual que <b>la fuerza</b>.',4)}`,
beats:[
`Algo muy importante: el momento es un vector. Tiene tamaño y dirección. Y como la masa siempre es positiva, el momento apunta exactamente hacia donde apunta la velocidad.`,
`Ejemplo de la clase: una bolita de 1,5 kilos que va hacia la derecha a 2 metros por segundo. Hacia la derecha es la dirección i gorro, el vector unitario del eje x.`,
`Su momento es m por v. Multiplicamos la masa por la velocidad: 1,5 por 2,0, en dirección i gorro.`,
`Da 3,0 i gorro kilogramo metro por segundo. Un vector de tamaño 3, que apunta hacia la derecha, igual que la velocidad.`,
`¿Y el impulso hacia dónde apunta? Hacia donde apunta el cambio de velocidad. Esa es la misma dirección de la aceleración, y la misma dirección de la fuerza. El impulso siempre apunta como la fuerza.`]
});

S({title:'Ejemplo extra: el signo lo es todo',

${Q(700,310,'p_f = 0,5 · (−8) = −4 [kg·m/s]',2,'s')}

`Un ejemplo extra, que no está en la clase, para practicar el detalle que más errores produce: los signos. Una pelota de 0,5 kilos choca contra una pared a 10 metros por segundo, y rebota a 8 metros por segundo. ¿Qué impulso recibió?`,
`Primero, siempre, elegimos un sentido positivo. Digamos que hacia la derecha es positivo. Entonces la velocidad inicial, que va hacia la pared, es más 10. Y la final, como va hacia la izquierda, es menos 8.`,
`Momento inicial: masa por velocidad, 0,5 por 10, más 5. Momento final: 0,5 por menos 8, menos 4.`,

`El error típico es restar los tamaños, 8 menos 10, y decir que el cambio es 2. Eso está mal. Cuando algo rebota, las velocidades tienen signos opuestos, y los cambios se suman: de más 10 a menos 8 hay 18 metros por segundo de cambio.`,
`Y si nos dicen que el choque duró 0,01 segundos, la fuerza promedio de la pared es el impulso dividido por el tiempo: 9 dividido por 0,01, que da 900 newton. Un choque corto produce fuerzas enormes.`],

S({title:'Momento de un sistema',
html:`${svg(`
${arr(120,560,330,470,'mom','p'+sb('1'),0,[210,480])}

${arr(120,560,640,330,'acc','p'+sb('total'),{b:1},[420,500],'stroke-width:6')}`)}
${Q(720,200,`${vc('p')}_{total} = ${vc('p')}_1 + ${vc('p')}_2 + ${vc('p')}_3`,0,'s')}
${N(720,300,480,'<b>1D:</b> suma con signo. Derecha +, izquierda −.',2)}
${N(720,400,480,'<b>2D:</b> suma por componentes.',3)}
${Q(720,470,'p_{x,total} = p_{1x} + p_{2x} + p_{3x}',3,'xs')}
${Q(720,530,'p_{y,total} = p_{1y} + p_{2y} + p_{3y}',3,'xs')}`,
beats:[
`Si tenemos varios cuerpos, a todo el grupo le llamamos sistema. Y el momento del sistema es la suma de los momentos de cada cuerpo: p 1, más p 2, más p 3.`,
`Pero es una suma de vectores, no de números. Gráficamente: pones las flechas una detrás de la otra, la cola de cada una en la punta de la anterior. La flecha que va desde el inicio de la primera hasta la punta de la última es el momento total.`,
`En una dimensión es fácil: sumas con signo. Lo que va a la derecha es positivo y lo que va a la izquierda es negativo.`,
`En dos dimensiones sumas por componentes: todas las componentes x por un lado, y todas las componentes y por el otro. Eso lo vamos a practicar mucho en la clase 18.`]
});

/* ===================== CH2 CONSERVACIÓN ===================== */
CH('Conservación del momento','Clase 16','Capítulo dos: la conservación del momento lineal. Es la herramienta que vas a usar en todos los problemas del control.');

S({title:'Fuerzas internas y externas',
html:`${svg(`
${gnd(110,690,520,0)}
<g data-b="0"><rect x="180" y="330" width="440" height="230" rx="18" class="ln2 dashl" style="stroke:var(--acc)"/></g>
${tx(400,312,'sistema',0,'smacc')}
${cball(340,450,52,'A','A',0)}${cball(460,450,52,'B','B',0)}
<g data-b="1">${arr(420,372,540,372,'imp','F'+sb('A→B'),null,[585,350])}${arr(380,372,260,372,'imp','F'+sb('B→A'),null,[215,350])}</g>
<g data-b="2">${arr(240,450,240,520,'peso','',null)}${tx(205,505,'P',null,'lab')}${arr(560,520,560,450,'normal','',null)}${tx(595,475,'N',null,'lab')}${tx(400,620,'externas: vienen de afuera',null,'sm')}</g>`)}
${N(740,190,470,'<b>Internas:</b> las que se hacen entre ellos.',1)}
${N(740,280,470,'<b>Externas:</b> peso, normal, roce, una mano…',2)}
${Q(740,380,`${vc('F')}_{A→B} = −${vc('F')}_{B→A}`,3,'s')}
${N(740,440,470,'Misma fuerza, mismo tiempo de contacto.',3)}
${Q(740,520,`${vc('I')}_{B} = −${vc('I')}_{A}`,4,'s box')}
${N(740,600,470,'Lo que gana B, lo pierde A.',4)}`,
beats:[
`Para hablar de conservación, primero hay que separar dos tipos de fuerzas. Dibujamos una caja imaginaria alrededor de los cuerpos que nos interesan. Eso es el sistema.`,
`Las fuerzas internas son las que los cuerpos del sistema se hacen entre ellos. En un choque, A empuja a B y B empuja a A.`,
`Las fuerzas externas son las que vienen de afuera de la caja: el peso, que lo pone la Tierra, la normal que pone el suelo, el roce, una mano que empuja.`,
`Y aquí viene el truco. Por la tercera ley de Newton, la fuerza de A sobre B es igual y opuesta a la fuerza de B sobre A. Y actúan durante exactamente el mismo tiempo: el tiempo que están en contacto.`,
`Entonces sus impulsos también son iguales y opuestos. El momento que gana B es justo el que pierde A. La suma no cambia. Las fuerzas internas solo pasan momento de un cuerpo al otro.`]
});

S({title:'La ley de conservación',
html:`
${Q(90,180,`ΣF_{ext} = ${fr('Δp_{total}','Δt')}`,0,'l')}
${Q(90,300,'ΣF_{ext} = 0  ⇒  p_{total} = {{constante}}',1,'l')}
${Q(90,410,`${vc('p')}_{antes} = ${vc('p')}_{después}`,2,'xl box')}
${Q(90,560,'m_1 v_1 + m_2 v_2 = m_1 v_1′ + m_2 v_2′',3,'l')}
${N(820,200,400,'Las fuerzas internas no aparecen: se cancelan de a pares.',0)}
${N(820,340,400,'Cada cuerpo <b>sí</b> cambia su momento. Lo que se conserva es <b>la suma</b>.',4)}`,
beats:[
`Juntemos todo. Para el sistema completo, la fuerza externa neta es igual al cambio del momento total dividido por el tiempo. Las fuerzas internas no aparecen, porque se cancelan de a pares.`,
`Si no hay fuerzas externas, o si las que hay suman cero, entonces el momento total no cambia. Es constante. Decimos que el momento se conserva.`,
`En un choque eso se escribe así: el momento total antes del choque es igual al momento total después del choque. Esta es la ecuación del control.`,
`Para dos cuerpos en una dimensión se ve así: m 1 v 1 más m 2 v 2, antes, igual a m 1 v 1 prima más m 2 v 2 prima, después. Cada velocidad lleva su signo.`,
`Fíjate en algo que confunde a mucha gente: los cuerpos, cada uno por su cuenta, sí cambian su momento. Lo que se conserva es la suma de todos.`]
});

S({title:'¿Cuándo se puede usar?',
html:`
${LI(90,190,1,'<b>Choques y explosiones.</b> Duran un instante y las fuerzas internas son gigantes: el peso o el roce no alcanzan a cambiar el momento. Comparas <b>justo antes</b> con <b>justo después</b>.',1)}
${LI(90,330,2,'<b>Por ejes.</b> Si no hay fuerza externa en <i>x</i>, se conserva <i>p<sub>x</sub></i>, aunque en <i>y</i> actúen el peso y la normal.',2)}
${LI(90,450,3,'<b>Solo en el choque.</b> Si después sube una rampa, se columpia o cae, esa parte se resuelve con <b>energía</b>.',3)}`,
beats:[
`Ahora la pregunta práctica: ¿cuándo puedo usar la conservación del momento? Hay tres ideas que tienes que tener claras.`,
`Uno: en choques y explosiones. Duran un instante muy corto, y en ese instante las fuerzas internas son gigantes, mucho más grandes que el peso o el roce. Por eso, durante el choque, las externas no alcanzan a cambiar el momento, y se pueden ignorar. Se compara justo antes con justo después.`,
`Dos: el momento puede conservarse en una sola dirección. Por ejemplo, sobre hielo sin roce no hay fuerzas horizontales, así que el momento horizontal se conserva. Pero en vertical están el peso y la normal del hielo, que pueden cambiar el momento vertical. Lo vas a ver en el trineo y en el carrito con el paquete.`,
`Tres, y esto es un error clásico: la conservación sirve para el instante del choque. Si después el cuerpo sube por una rampa, se columpia o cae, ahí actúan fuerzas externas durante un buen rato. Para esa parte se usa energía, no momento. El péndulo balístico es el ejemplo perfecto.`]
});

S({title:'Método para problemas de choques',
html:`
${P(90,172,'Paso a paso','acc',0)}
${LI(90,228,1,'<b>Dos dibujos:</b> justo antes y justo después del choque.',1)}
${LI(90,300,2,'<b>Ejes y sentido positivo.</b> Escríbelo en la hoja.',2)}
${LI(90,372,3,'<b>Momento de cada cuerpo</b>, con signo o con componentes.',3)}
${LI(90,444,4,'<b>Iguala</b> <i>p</i><sub>antes</sub> = <i>p</i><sub>después</sub>: una ecuación por eje.',4)}
${LI(90,516,5,'<b>Despeja</b> e interpreta el signo.',5)}
${LI(90,588,6,'<b>¿Tipo de choque?</b> Compara <i>K</i> antes y después.',6)}`,
beats:[
`Te dejo el método que vamos a usar en todos los problemas.`,
`Uno: haz dos dibujos, uno justo antes del choque y otro justo después. En cada uno, pon las masas y las velocidades que conoces, y las que no conoces con un signo de interrogación.`,
`Dos: elige tus ejes y un sentido positivo, y escríbelo en la hoja. Eso te ahorra la mitad de los errores.`,
`Tres: escribe el momento de cada cuerpo, masa por velocidad, con su signo en una dimensión, o con sus componentes en dos dimensiones.`,
`Cuatro: iguala el momento total antes con el momento total después. Una ecuación por cada eje en que se conserve.`,
`Cinco: despeja la incógnita. Si sale negativa, no está mal: significa que va en el sentido contrario al que elegiste como positivo.`,
`Seis: si te preguntan qué tipo de choque fue, calculas la energía cinética antes y después y las comparas. Eso lo vemos ahora mismo.`]
});

/* ===================== CH3 TIPOS DE COLISIONES ===================== */
CH('Tipos de colisiones','Clases 16 y 18','Capítulo tres: los tipos de colisiones. En un choque el momento siempre se conserva. La energía cinética, no siempre.');

S({title:'Momento y energía cinética',
html:`
${Q(90,190,`K = ${fr('1','2')} m v^2`,0,'xl')}
${N(90,330,520,'Es un <b>número</b>, siempre positivo. No es un vector: el signo de <i>v</i> no importa.',0)}
${Q(700,190,'p {{se conserva en todo choque}}',1,'s acc')}
${Q(700,270,'K {{puede cambiar}}',1,'s')}
${N(700,330,500,'Se va en calor, ruido y deformación.',1)}
${Q(90,470,'{{Elástica:}} K_{antes} = K_{después}',2,'l')}
${Q(90,570,'{{Inelástica:}} K_{antes} ≠ K_{después}',3,'l')}
${N(820,570,400,'Puede ser <b>menor</b> o <b>mayor</b> (explosión).',3)}`,
beats:[
`Recordemos la energía cinética: un medio de m v al cuadrado. Es la energía que tiene un cuerpo por estar moviéndose. Y a diferencia del momento, no es un vector: es un número, y siempre es positivo, porque la velocidad va al cuadrado.`,
`En todos los choques el momento total se conserva. Pero la energía cinética total puede cambiar, porque una parte se puede transformar en calor, en ruido o en deformar los cuerpos. Piensa en el ruido de un choque de autos: eso es energía que se fue.`,
`Según lo que pasa con la energía cinética, los choques se clasifican. Choque elástico: la energía cinética total antes es igual a la energía cinética total después. No se perdió nada.`,
`Choque inelástico: la energía cinética antes es distinta de la de después. Casi siempre disminuye. Pero la clase 18 dice que puede ser mayor o menor, porque en una explosión, o cuando alguien salta, energía química se transforma en energía cinética, y la cinética aumenta.`]
});

S({title:'Los cuatro casos',
html:`${svg(`
${sep(440,0)}<line x1="640" y1="170" x2="640" y2="700" class="ln2 dashl" data-b="0"/>
<g data-b="0">${ttl(355,190,'ELÁSTICO')}${gnd(90,610,400)}<g id="t1a">${cball(0,0,26,'A','')}</g><g id="t1b">${cball(0,0,26,'B','')}</g></g>
<g data-b="1">${ttl(925,190,'INELÁSTICO')}${gnd(670,1190,400)}<g id="t2a">${cball(0,0,26,'A','')}</g><g id="t2b">${cball(0,0,32,'B','')}</g></g>
<g data-b="2">${ttl(355,470,'PERFECTAMENTE INELÁSTICO')}${gnd(90,610,670)}<g id="t3a">${cball(0,0,26,'A','')}</g><g id="t3b">${cball(0,0,32,'B','')}</g></g>
<g data-b="3">${ttl(925,470,'EXPLOSIÓN')}${gnd(670,1190,670)}<g id="t4a">${cball(0,0,26,'A','')}</g><g id="t4b">${cball(0,0,32,'B','')}</g></g>`)}
${N(110,232,500,'<i>K</i> igual. Masas iguales: <b>intercambian</b> velocidades.',0)}
${N(690,232,500,'Rebotan más lento: <i>K</i> disminuye.',1)}
${N(110,512,500,'Quedan <b>pegados</b>: la mayor pérdida de <i>K</i>.',2)}
${N(690,512,500,'Parten juntos y se separan: <i>K</i> <b>aumenta</b>.',3)}`,
beats:[
`Veámoslos en movimiento. Arriba a la izquierda, un choque elástico. Dos bolas iguales, una en reposo. La que llega se detiene, y la otra sale con la misma rapidez. Intercambiaron velocidades. No se perdió energía cinética.`,
`Arriba a la derecha, un choque inelástico. Los cuerpos rebotan, pero más lento de lo que deberían. Se perdió parte de la energía cinética.`,
`Abajo a la izquierda, el caso extremo: los cuerpos quedan pegados y siguen juntos, con la misma velocidad. Se llama choque perfectamente inelástico, o totalmente inelástico. Es el choque que pierde la mayor cantidad posible de energía cinética. El péndulo balístico y el carrito con el paquete son de este tipo.`,
`Abajo a la derecha, una explosión. Los cuerpos parten juntos y en reposo, y salen disparados en sentidos opuestos. El momento total era cero y sigue siendo cero, pero la energía cinética aumentó. El trineo de Luis y Karen es de este tipo.`,
`Un dato: las bolas de pool se acercan mucho a un choque elástico. Los choques de autos, en cambio, suelen ser muy inelásticos. Aunque en el ejercicio de la clase 16 vamos a descubrir algo curioso con eso.`],
loop(st,r){const P=5,c=st%P,tc=2;
  setT(r,'t1a',p1d(c,tc,330,110,0),374);setT(r,'t1b',p1d(c,tc,382,0,110),374);
  setT(r,'t2a',p1d(c,tc,900,110,-30),374);setT(r,'t2b',p1d(c,tc,958,0,55),368);
  setT(r,'t3a',p1d(c,tc,330,120,48),644);setT(r,'t3b',p1d(c,tc,388,0,48),638);
  setT(r,'t4a',p1d(c,tc,900,0,-95),644);setT(r,'t4b',p1d(c,tc,958,0,75),638)}
});

S({title:'¿Cómo saber qué tipo de choque es?',
html:`
${LI(90,190,1,'Calcula <i>K</i><sub>antes</sub>: suma ½ <i>m v</i>² de <b>todos</b> los cuerpos.',0)}
${LI(90,270,2,'Calcula <i>K</i><sub>después</sub> igual, con las velocidades prima.',1)}
${LI(90,350,3,'Compara:',2)}
${Q(160,420,'K_{antes} = K_{después}  →  {{elástico}}',2,'s')}
${Q(160,480,'K_{después} < K_{antes}  →  {{inelástico}}',2,'s')}
${Q(160,540,'{{quedan juntos}}  →  {{perfectamente inelástico}}',2,'s')}
${N(90,620,1100,'En 2D usa la rapidez: <i>v</i>² = <i>v<sub>x</sub></i>² + <i>v<sub>y</sub></i>². Y <b>nunca</b> sumes energías con signo.',3)}`,
beats:[
`Entonces, si te preguntan qué tipo de choque fue, el procedimiento es siempre el mismo. Uno: calcula la energía cinética total antes del choque, sumando un medio m v al cuadrado de todos los cuerpos que se mueven.`,
`Dos: calcula la energía cinética total después del choque, de la misma forma, usando las velocidades prima.`,
`Tres: compara. Si son iguales, el choque es elástico. Si la de después es menor, es inelástico. Y si además los cuerpos quedaron pegados, es perfectamente inelástico.`,
`Dos cuidados. En dos dimensiones, v al cuadrado es la rapidez al cuadrado: la componente x al cuadrado más la componente y al cuadrado. Y nunca le pongas signo a una energía cinética. Es siempre positiva, aunque el cuerpo vaya hacia la izquierda.`]
});

S({title:'Choque elástico en 1D: las dos ecuaciones',
html:`
${Q(90,175,'{{momento:}} m_1 v_1 + m_2 v_2 = m_1 v_1′ + m_2 v_2′',0,'s')}
${Q(90,240,`{{energía:}} ${fr('1','2')}m_1 v_1^2 + ${fr('1','2')}m_2 v_2^2 = ${fr('1','2')}m_1 v_1′^2 + ${fr('1','2')}m_2 v_2′^2`,1,'xs')}
${N(90,318,700,'Caso común: el cuerpo 2 parte en reposo (<i>v</i><sub>2</sub> = 0).',2)}
${Q(90,370,'m_1 (v_1 − v_1′) = m_2 v_2′',2,'s')}
${Q(90,430,'m_1 (v_1 − v_1′)(v_1 + v_1′) = m_2 v_2′^2',3,'s')}
${Q(90,505,'v_1 + v_1′ = v_2′',4,'s box')}
${Q(720,370,`v_1′ = ${fr('m_1 − m_2','m_1 + m_2')} v_1`,5,'s')}
${Q(720,470,`v_2′ = ${fr('2 m_1','m_1 + m_2')} v_1`,5,'s')}
${Q(720,580,'m_1 = m_2  ⇒  v_1′ = 0 ,  v_2′ = v_1',6,'s box')}
${N(90,600,580,'No hace falta memorizarlas: sí hay que saber <b>plantear</b> las dos ecuaciones.',7)}`,
beats:[
`La clase 16 plantea esta pregunta: si dos masas chocan de forma elástica, ¿con qué velocidades salen? Para responder se plantean dos ecuaciones. Una de momento y otra de energía. Como hay dos incógnitas, v 1 prima y v 2 prima, con dos ecuaciones alcanza.`,
`Ecuación uno, momento: m 1 v 1 más m 2 v 2, igual a m 1 v 1 prima más m 2 v 2 prima. Ecuación dos, energía cinética: un medio m 1 v 1 al cuadrado más un medio m 2 v 2 al cuadrado, igual a lo mismo con las velocidades prima. Los un medio aparecen en todos los términos, así que se cancelan.`,
`Hagamos el caso más común: el cuerpo 2 parte en reposo, v 2 igual a cero. En la ecuación de momento, juntamos todo lo de la masa 1 a la izquierda: m 1 por, v 1 menos v 1 prima, igual a m 2 v 2 prima.`,
`En la de energía hacemos lo mismo: m 1 por, v 1 al cuadrado menos v 1 prima al cuadrado, igual a m 2 v 2 prima al cuadrado. Y la diferencia de cuadrados se factoriza: v 1 menos v 1 prima, por v 1 más v 1 prima.`,
`Ahora divide la ecuación de energía por la de momento. El m 1, y el paréntesis v 1 menos v 1 prima, se cancelan arriba y abajo. Y a la derecha, m 2 v 2 prima al cuadrado dividido por m 2 v 2 prima, da v 2 prima. Queda algo muy simple: v 1 más v 1 prima igual a v 2 prima.`,
`Con esa ecuación y la de momento, despejas y llegas a dos fórmulas. v 1 prima es: m 1 menos m 2, sobre m 1 más m 2, por v 1. Y v 2 prima es: 2 m 1, sobre m 1 más m 2, por v 1.`,
`Caso especial importante: si las masas son iguales, v 1 prima da cero y v 2 prima da v 1. Intercambian velocidades: la que venía se detiene y la otra sale con la misma rapidez. Es lo que pasa en el pool cuando le pegas a una bola de frente.`,
`No necesitas memorizar estas fórmulas: la clase no las pide. Pero sí tienes que saber plantear las dos ecuaciones, momento y energía. Y las fórmulas son útiles para revisar tus respuestas. Las vamos a usar para comprobar el ejercicio de los autos.`]
});

S({title:'Planteamos la conservación',
html:`${svg(`
${ttl(300,190,'ANTES',0)}${ttl(300,440,'DESPUÉS',2)}
${arr(90,250,490,250,'mom','p'+sb('2,i'),0,[290,222])}
${tx(300,290,'p'+sb('1,i')+' = 0',0,'sm')}
${arr(90,500,570,500,'mom','p'+sb('1,f'),2,[330,472])}
${arr(570,560,490,560,'mom','p'+sb('2,f'),5,[530,592])}
${arr(90,630,490,630,'acc','p'+sb('total'),6,[290,660],'stroke-width:6')}`)}
${Q(700,180,'p_{2,i} = 1200 · 20 = 24 000 [kg·m/s]',1,'xs')}
${Q(700,235,'p_{1,i} = 0',1,'xs')}
${Q(700,300,'p_{1,f} = 1800 · 16 = 28 800 [kg·m/s]',2,'xs')}
${Q(700,370,'m_2 v_{2,i} = m_1 v_{1,f} + m_2 v_{2,f}',3,'xs')}
${Q(700,445,`v_{2,f} = ${fr('m_2 v_{2,i} − m_1 v_{1,f}','m_2')}`,4,'xs')}
${Q(700,535,`v_{2,f} = ${fr('24 000 − 28 800','1200')} = −4 [m/s]`,5,'xs box')}`,
beats:[
`Paso tres: el momento de cada auto antes del choque. El auto chico: masa por velocidad, 1200 por 20, que da 24 mil kilogramo metro por segundo. El grande está quieto, así que su momento es cero. Momento total antes: 24 mil.`,
`Después del choque, el auto grande tiene un momento de 1800 por 16, que da 28 mil 800.`,
`Mira algo raro: el grande, solo, ya tiene más momento que todo el sistema antes del choque. 28 mil 800 es más que 24 mil. Entonces el auto chico tiene que compensar con momento negativo.`,
`Paso cuatro: igualamos. Momento antes, m 2 v 2 inicial, igual a momento después, m 1 v 1 final más m 2 v 2 final. El término del auto grande antes no aparece porque es cero.`,
`Despejamos v 2 final: pasamos m 1 v 1 final restando al otro lado, y dividimos todo por m 2. Queda: m 2 v 2 inicial menos m 1 v 1 final, dividido por m 2.`,
`Reemplazamos: 24 mil menos 28 mil 800, que da menos 4 mil 800, dividido por 1200. Resultado: menos 4 metros por segundo. El signo menos dice que el auto chico rebota hacia atrás, a 4 metros por segundo.`,
`Comprobemos con las flechas: 28 mil 800 hacia adelante, menos 4 mil 800 hacia atrás, suma 24 mil. Exactamente el momento total de antes. Se conservó.`]
});

S({title:'¿Qué tipo de colisión fue?',
html:`
${Q(90,190,`K_{antes} = ${fr('1','2')} · 1200 · 20^2 = 240 000 [J]`,0,'s')}
${Q(90,290,`K_{después} = ${fr('1','2')} · 1800 · 16^2 + ${fr('1','2')} · 1200 · (−4)^2`,1,'s')}
${Q(90,380,'K_{después} = 230 400 + 9 600 = 240 000 [J]',2,'s')}
${Q(90,470,'K_{antes} = K_{después}  ⇒  {{¡elástica!}}',3,'l box')}
${Q(90,590,`{{Chequeo:}} v_1′ = ${fr('2 · 1200','3000')} · 20 = 16   ,   v_2′ = ${fr('1200 − 1800','3000')} · 20 = −4`,4,'xs')}`,
beats:[
`La clase pregunta: ¿qué tipo de colisión fue esta? Para saberlo, comparamos la energía cinética. Antes del choque solo se mueve el auto chico: un medio por 1200 por 20 al cuadrado. 20 al cuadrado es 400, por 1200 es 480 mil, y la mitad es 240 mil joule.`,
`Después se mueven los dos: un medio por 1800 por 16 al cuadrado, más un medio por 1200 por menos 4 al cuadrado. Ojo: menos 4 al cuadrado es más 16. La energía no tiene signo.`,
`El primer término da 230 mil 400 y el segundo 9 mil 600. Suman 240 mil joule.`,
`¡Es exactamente la misma energía cinética! Así que, con estos datos, el choque es elástico. Es lo curioso que te anticipé: en la vida real un choque de autos casi nunca es elástico, pero los números del ejercicio dan justo eso.`,
`Y podemos comprobarlo con las fórmulas del choque elástico que vimos. v 1 prima es 2 por 1200, sobre 3000, por 20: da 16. Y v 2 prima es 1200 menos 1800, sobre 3000, por 20: da menos 4. Coinciden perfecto con lo que calculamos.`]
});

S({title:'El impulso sobre cada auto',
html:`
${Q(90,180,'I_1 = p_{1,f} − p_{1,i} = 28 800 − 0',0,'s')}
${Q(90,245,'I_1 = +28 800 [N·s]',0,'s box')}
${Q(90,350,'I_2 = p_{2,f} − p_{2,i} = 1200 · (−4) − 24 000',1,'s')}
${Q(90,415,'I_2 = −4 800 − 24 000 = −28 800 [N·s]',1,'s box')}
${Q(90,525,'I_1 + I_2 = 0',2,'l acc')}
${N(520,530,700,'Iguales y opuestos: es la <b>tercera ley de Newton</b>. Por eso el momento total no cambia.',2)}
${Q(90,620,`{{Si duró}} 0,1 [s]: F = ${fr('28 800','0,1')} = 288 000 [N]`,3,'xs dim')}`,
beats:[
`Última pregunta de la clase: ¿qué impulso recibió cada auto? El impulso es el cambio de momento: final menos inicial. Para el auto grande: 28 mil 800 menos cero. Más 28 mil 800 newton segundo, hacia adelante.`,
`Para el auto chico: final, 1200 por menos 4, que es menos 4 mil 800. Menos el inicial, 24 mil. Total: menos 28 mil 800 newton segundo, hacia atrás.`,
`Los dos impulsos tienen el mismo tamaño y signos opuestos. Suman cero. No es casualidad: es la tercera ley de Newton. Cada auto empujó al otro con la misma fuerza durante el mismo tiempo. Por eso el momento total se conservó.`,
`Y si el choque hubiera durado, por ejemplo, una décima de segundo, la fuerza promedio sería el impulso dividido por el tiempo: 288 mil newton. Ese dato del tiempo es inventado, solo para que veas el tamaño de las fuerzas en un choque.`]
});

CH('Péndulo balístico','Clase 16','Capítulo cinco: el péndulo balístico. Es el ejemplo perfecto de un problema en dos etapas: primero momento, después energía.');

S({title:'El aparato',
html:`${svg(`
${ceil(260,560,180,0)}
<line id="pb_w1" x1="340" y1="180" class="ln" style="stroke-width:2"/><line id="pb_w2" x1="480" y1="180" class="ln" style="stroke-width:2"/>
<g id="pb_blk">${cbox(-80,-55,160,110,'B','m₂')}</g>
<g id="pb_bul"><rect x="-16" y="-6" width="32" height="12" rx="6" style="fill:var(--A)"/></g>
${darr('pb_v','vel','v'+sb('1'),0)}
<g data-b="1"><line x1="500" y1="535" x2="600" y2="535" class="ln2 dashl"/><line x1="500" y1="500" x2="600" y2="500" class="ln2 dashl"/></g>
${dim(580,535,580,500,'',1)}${tx(620,517,'h',1,'lab')}`)}
${N(740,190,470,'Una bala de masa <b>m₁</b> con rapidez <b>v₁</b> se incrusta en un bloque de madera <b>m₂</b> colgado de alambres livianos.',0)}
${N(740,330,470,'El conjunto se balancea y sube una altura <b>h</b>.',1)}
${N(740,430,470,'¿Cómo obtener <b>v₁</b> midiendo <b>h</b>?',2,'acc')}
${P(740,530,'1 · choque → momento','mom',3)}
${P(740,590,'2 · subida → energía','K',3)}`,
beats:[
`El péndulo balístico es un aparato que sirve para medir la rapidez de algo que va muy rápido, como una bala. Se dispara una bala de masa m 1 contra un bloque grande de madera, de masa m 2, que cuelga de unos alambres livianos.`,
`La bala se incrusta en el bloque, y el conjunto, bloque con bala, se balancea hacia arriba como un columpio, hasta subir una altura h.`,
`La pregunta de la clase es: ¿cómo se determina la rapidez de la bala a partir de una medición de h? Medir una altura es fácil. Medir la rapidez de una bala, no.`,
`La clave es separar el problema en dos etapas. Etapa uno: el choque, que dura un instante. Ahí se usa momento. Etapa dos: la subida, que dura un buen rato. Ahí se usa energía. Nunca se mezclan.`],
loop(st,r){const P=6,c=st%P,tc=1.4;let bx=c<tc?120+(215)*(c/tc):410;const sw=c<tc?0:Math.sin(Math.min(1,(c-tc)/1.3)*Math.PI/2)*28*(c<5?1:Math.max(0,1-(c-5)));
  const a=sw*Math.PI/180,L=300,cx=410,cy=180;const X=cx+L*Math.sin(a),Y=cy+L*Math.cos(a);setT(r,'pb_blk',X,Y+55);
  ['pb_w1','pb_w2'].forEach((id,k)=>{const e=r.querySelector('#'+id);if(e){e.setAttribute('x2',X+(k?70:-70));e.setAttribute('y2',Y)}});
  setT(r,'pb_bul',c<tc?bx:X-20,c<tc?535:Y+55);const v=r.querySelector('#pb_v');if(v)v.style.opacity=c<tc?1:0;setArr(r,'pb_v',bx-10,500,bx+70,500)}
});

S({title:'Etapa 1: el choque (momento)',
html:`${svg(`
${ttl(320,190,'JUSTO ANTES',0)}
<rect x="70" y="244" width="34" height="12" rx="6" style="fill:var(--A)" data-b="0"/>
${arr(115,250,215,250,'vel','v'+sb('1'),0,[165,222])}
${cbox(260,195,160,110,'B','m₂',0)}${tx(340,330,'en reposo',0,'sm')}
${ttl(320,420,'JUSTO DESPUÉS',1)}
${cbox(240,440,180,110,'B','m₁ + m₂',1)}
${arr(430,495,540,495,'vel','V',1,[565,495])}`)}
${Q(700,190,'m_1 v_1 + m_2 · 0 = (m_1 + m_2) V',2,'s')}
${Q(700,280,`V = ${fr('m_1 v_1','m_1 + m_2')}`,3,'l box')}
${N(700,400,500,'<b>No</b> se usa energía aquí: la bala se incrusta, es <b>perfectamente inelástico</b>. Casi toda su energía se va en calor y en romper madera.',4)}`,
beats:[
`Etapa uno, el choque. Dibujamos justo antes: la bala con rapidez v 1 y el bloque en reposo. Justo después: la bala ya está dentro del bloque, y los dos se mueven juntos con una misma velocidad, que llamamos V mayúscula.`,
`El choque dura un instante, así que el momento se conserva. Antes: m 1 v 1, más m 2 por cero. Después: como se mueven juntos, la masa total m 1 más m 2, por V.`,
`Despejamos V: es m 1 v 1, dividido por m 1 más m 2. Como el bloque es mucho más pesado que la bala, V es mucho más chica que v 1.`,
`¿Por qué no usamos energía en esta etapa? Porque la bala se incrusta: es un choque perfectamente inelástico. Casi toda la energía de la bala se transforma en calor y en romper la madera. Si igualaras energías aquí, el resultado saldría muy mal.`]
});

S({title:'Etapa 2: la subida (energía)',
html:`${svg(`
${ceil(150,450,180,0)}
<line x1="300" y1="180" x2="300" y2="480" class="ln2 dashl" data-b="0"/>
${cbox(230,480,140,90,'B','',0)}
<g data-b="0"><path d="M300 180 L 470 425" class="ln" style="stroke-width:2"/>${cbox(400,390,140,90,'B','')}</g>
${dim(600,525,600,435,'h',0,630,480)}
<g data-b="0"><line x1="370" y1="525" x2="610" y2="525" class="ln2 dashl"/><line x1="540" y1="435" x2="610" y2="435" class="ln2 dashl"/></g>
${tx(300,610,'abajo: solo K',1,'smacc')}${tx(470,360,'arriba: solo U'+sb('g'),2,'smacc')}`)}
${Q(720,190,`${fr('1','2')} (m_1 + m_2) V^2 = (m_1 + m_2) g h`,3,'s')}
${Q(720,300,'V^2 = 2 g h',4,'l')}
${Q(720,390,`V = ${rt('2 g h')}`,4,'l box')}
${N(720,500,500,'Aquí <b>no</b> se conserva el momento: la tensión y el peso actúan durante toda la subida.',5)}`,
beats:[
`Etapa dos, la subida. Justo después del choque, el conjunto bloque más bala está abajo, moviéndose con rapidez V. Luego sube hasta que se detiene, a una altura h.`,
`Abajo, el conjunto solo tiene energía cinética. Ponemos el nivel cero de altura ahí, así que la potencial gravitatoria es cero.`,
`Arriba, en el punto más alto, se detiene un instante. La rapidez es cero, así que solo hay energía potencial gravitatoria.`,
`Durante la subida no hay roce, y la tensión de los alambres es siempre perpendicular al movimiento, así que no hace trabajo. La energía mecánica se conserva: un medio por la masa total por V al cuadrado, igual a la masa total por g por h.`,
`La masa total aparece a los dos lados y se cancela. Queda V al cuadrado igual a 2 g h. Y entonces V es la raíz de 2 g h. Es la misma fórmula de la caída libre, pero al revés.`,
`Y aquí ocurre lo contrario que en la etapa uno: el momento no se conserva durante la subida. Mientras sube, actúan la tensión y el peso, que son fuerzas externas, durante un buen rato. El conjunto se frena. Su momento cambia.`]
});

S({title:'Juntamos las dos etapas',
html:`
${Q(90,180,`V = ${fr('m_1 v_1','m_1 + m_2')}   {{y}}   V = ${rt('2 g h')}`,0,'s')}
${Q(90,300,`v_1 = ${fr('m_1 + m_2','m_1')} ${rt('2 g h')}`,1,'l box')}
${N(90,470,520,'<b>Con números inventados:</b> m₁ = 10 g, m₂ = 2,0 kg, h = 5,0 cm.',2)}
${Q(680,180,'m_1 = 0,010 [kg] ,  h = 0,050 [m]',2,'xs')}
${Q(680,245,`V = ${rt('2 · 10 · 0,05')} = 1,0 [m/s]`,3,'xs')}
${Q(680,315,`v_1 = ${fr('2,010','0,010')} · 1,0 = 201 [m/s]`,4,'xs box')}
${Q(680,420,'K_{bala} = ½ · 0,010 · 201^2 ≈ 202 [J]',5,'xs')}
${Q(680,480,'K_{después} = ½ · 2,01 · 1,0^2 ≈ 1 [J]',5,'xs')}
${N(680,560,520,'¡Se pierde más del <b>99 %</b> de la energía en el choque!',5,'acc')}`,
beats:[
`Ahora juntamos las dos etapas. De la etapa uno tenemos V en función de la rapidez de la bala. De la etapa dos tenemos V en función de la altura. Las dos son la misma V, la velocidad justo después del choque.`,
`Igualamos y despejamos v 1: v 1 es igual a m 1 más m 2, dividido por m 1, por la raíz de 2 g h. Con medir h y las masas, ya sabes la rapidez de la bala.`,
`Pongamos números. La clase no los da, así que estos los inventamos para practicar: una bala de 10 gramos, un bloque de 2 kilos, y el bloque sube 5 centímetros. Primero, como siempre, pasamos a kilos y metros: 0,010 kilos y 0,050 metros.`,
`V es la raíz de 2 por 10 por 0,05. Eso es la raíz de 1, o sea 1 metro por segundo.`,
`La rapidez de la bala: la masa total, 2,010, dividida por 0,010, que da 201, por 1. La bala iba a 201 metros por segundo.`,
`Y mira la energía. La bala tenía un medio por 0,01 por 201 al cuadrado: unos 202 joule. Después del choque, el conjunto tiene un medio por 2,01 por 1 al cuadrado: apenas 1 joule. Se perdió más del 99 por ciento. Por eso, en el choque, jamás se iguala energía.`]
});

${N(700,260,520,'Externas: pesos y normal del piso. <b>Todas verticales.</b>',1)}
${Q(700,350,'p_x {{se conserva}}',2,'l acc')}
${Q(700,430,'p_y {{no se conserva}}',3,'s dim')}
${N(700,500,520,'Sin roce en ninguna parte: <b>la energía mecánica se conserva</b>.',4)}`,
beats:[
`Antes de calcular, la pregunta más importante de este problema: ¿qué se conserva? Tomamos como sistema el bloque más la cuña, juntos.`,
`¿Qué fuerzas externas actúan? El peso del bloque, el peso de la cuña, y la normal que el piso le hace a la cuña. Las tres son verticales. La fuerza entre el bloque y la cuña es interna, porque los dos están dentro del sistema.`,
`Como no hay ninguna fuerza externa horizontal, el momento horizontal del sistema se conserva. Durante toda la bajada, no solo en un instante.`,
`El momento vertical, en cambio, no se conserva. El bloque empieza quieto y gana velocidad hacia abajo, mientras baja, porque el peso no está compensado. Por eso solo usamos el eje x.`,
`Y como no hay roce en ninguna parte, no se pierde energía: la energía mecánica del sistema se conserva. Así que en este problema usamos las dos cosas: momento en x para la pregunta a, y energía para la pregunta b.`]
});

S({title:'a) La velocidad de la cuña',
html:`
${Q(90,190,'{{inicio:}} p_x = 0',0,'s')}
${N(560,195,620,'Todo parte en reposo.',0)}
${Q(90,270,'0 = m_1 v_1 + m_2 v_2',1,'l')}
${Q(90,380,`v_2 = −${fr('m_1 v_1','m_2')} = −${fr('0,50 · 4,00','3,00')}`,2,'l')}
${Q(90,510,'v_2 = −0,667 [m/s]',3,'l box')}
${N(600,515,600,'Hacia la <b>izquierda</b>, más lento que el bloque porque es más pesado.',3)}`,
beats:[
`Pregunta a. Al principio todo está en reposo: el bloque y la cuña. Así que el momento horizontal total al inicio es cero.`,
`Como se conserva, al final también tiene que ser cero. Entonces: cero es igual a m 1 v 1 más m 2 v 2. El momento del bloque hacia la derecha tiene que cancelar el momento de la cuña hacia la izquierda.`,
`Despejamos v 2: es menos m 1 v 1, dividido por m 2. Reemplazamos: menos 0,50 por 4,00, dividido por 3,00.`,
`Da menos 0,667 metros por segundo. El signo menos confirma que la cuña se mueve hacia la izquierda. Y va mucho más lento que el bloque, porque es seis veces más pesada.`]
});

S({title:'b) La altura de la cuña',
html:`
${Q(90,180,'E_{inicio} = m_1 g h',0,'s')}
${N(520,185,680,'Bloque arriba y quieto; cuña quieta.',0)}
${Q(90,250,`E_{final} = ${fr('1','2')} m_1 v_1^2 + ${fr('1','2')} m_2 v_2^2`,1,'s')}
${Q(90,340,'0,50 · 10 · h = ½ · 0,50 · 4,00^2 + ½ · 3,00 · 0,667^2',2,'xs')}
${Q(90,400,'5,0 h = 4,00 + 0,667',3,'s')}
${Q(90,470,`h = ${fr('4,667','5,0')} = 0,933 [m]`,3,'l box')}
${N(90,590,540,'Con g = 9,8 da h ≈ 0,952 m.',4)}
${P(700,470,'✕ olvidar la K de la cuña','B',5)}
${Q(700,530,`h = ${fr('v_1^2','2g')} = 0,80 [m]  {{está mal}}`,5,'xs dim')}`,
beats:[
`Pregunta b, la altura. Usamos conservación de la energía mecánica, con el nivel cero en el suelo. Al inicio, el bloque está a la altura h y quieto, y la cuña también está quieta. La única energía es la potencial del bloque: m 1 g h.`,
`Al final, el bloque está en el suelo, así que no tiene potencial. Pero ahora se mueven los dos: el bloque y la cuña. Hay dos energías cinéticas: un medio m 1 v 1 al cuadrado, más un medio m 2 v 2 al cuadrado.`,
`Igualamos y reemplazamos: 0,50 por 10 por h, igual a un medio por 0,50 por 4 al cuadrado, más un medio por 3,00 por 0,667 al cuadrado.`,
`A la izquierda queda 5 h. A la derecha, el bloque aporta 4,00 joule y la cuña 0,667 joule. Total 4,667. Entonces h es 4,667 dividido por 5: 0,933 metros.`,
`Si tu profesor usa g igual a 9,8, la altura da unos 0,952 metros. Revisa qué valor de g pide el enunciado del control.`,
`El error típico aquí es olvidarse de que la cuña también se mueve, y hacer como si fuera fija: h igual a v al cuadrado sobre 2 g, que da 0,80 metros. Eso está mal. Una parte de la energía del bloque se la llevó la cuña.`]
});

CH('Momento lineal en 2D','Clase 18','Capítulo siete: el momento lineal en dos dimensiones. La idea es la misma de antes, pero ahora trabajamos un eje a la vez.');

S({title:'Un eje a la vez',
html:`${svg(`
${axesG(150,560,330,0,'x','y')}
${arr(150,560,410,360,'mom','p',0,[430,340])}
<g data-b="1"><line x1="410" y1="360" x2="410" y2="560" class="ln2 dashl"/><line x1="150" y1="360" x2="410" y2="360" class="ln2 dashl"/>

${arc(150,560,70,0,37.6,'θ',1,96)}`)}
${Q(640,190,'p_x = m v cos θ',1,'s')}
${Q(640,250,'p_y = m v sen θ',1,'s')}
${N(640,320,560,'θ medido desde el eje <i>x</i>. Si el vector apunta hacia abajo o hacia la izquierda, la componente es <b>negativa</b>.',2)}
${Q(640,450,'Σ p_x^{antes} = Σ p_x^{después}',3,'s box')}
${Q(640,535,'Σ p_y^{antes} = Σ p_y^{después}',3,'s box')}
${N(640,620,560,'Dos ecuaciones: puedes despejar dos incógnitas.',4)}`,
beats:[
`En dos dimensiones el momento sigue siendo masa por velocidad. Pero ahora la flecha puede apuntar en diagonal.`,
`Igual que con las fuerzas, la descomponemos en sus componentes. La componente x es m v coseno theta, y la componente y es m v seno theta, donde theta es el ángulo medido desde el eje x.`,
`Ojo con los signos: si el vector apunta hacia abajo, su componente y es negativa. Si apunta hacia la izquierda, su componente x es negativa. Siempre mira el dibujo antes de poner el signo.`,
`Y ahora lo importante: la conservación del momento vale en cada eje por separado. La suma de las componentes x antes es igual a la suma de las componentes x después. Y lo mismo, por separado, con las componentes y.`,
`Eso te da dos ecuaciones. Y con dos ecuaciones puedes despejar dos incógnitas, por ejemplo dos rapideces, o una rapidez y un ángulo.`]
});

beats:[

S({title:'Método 1: por componentes',
html:`
${Q(90,180,`${vc('p')}_{antes} = m v_b î = m · 8 î`,0,'s')}
${Q(90,255,`${vc('p')}_{después} = m v_b′ (cos30° î + sen30° ĵ) + m v_1′ (cos60° î − sen60° ĵ)`,1,'xs')}
${N(90,315,1100,'La amarilla va <b>hacia abajo</b>: su componente <i>y</i> lleva signo <b>menos</b>.',1)}
${Q(90,395,'x:  m · 8 = m v_b′ cos30° + m v_1′ cos60°',2,'s')}
${Q(90,460,'y:  0 = m v_b′ sen30° − m v_1′ sen60°',2,'s')}
${N(90,540,1100,'La masa <i>m</i> está en todos los términos: <b>se cancela</b>. No hacía falta el dato 0,25 kg para las velocidades.',3)}`,
beats:[
`Método uno, analítico, por componentes. Antes del choque solo se mueve la blanca, y va puramente en x: el momento antes es m por 8, en dirección i gorro.`,
`Después se mueven las dos. La blanca: m v b prima, por coseno de 30 en i, más seno de 30 en j, porque va hacia arriba. La amarilla: m v 1 prima, por coseno de 60 en i, menos seno de 60 en j. El menos es porque va hacia abajo.`,
`Ahora igualamos por ejes. Eje x: m por 8, igual a m v b prima coseno 30, más m v 1 prima coseno 60. Eje y: antes no había nada en y, así que cero es igual a m v b prima seno 30, menos m v 1 prima seno 60.`,
`Fíjate que la masa m está en todos los términos de las dos ecuaciones. Se cancela. Para las velocidades, el dato de 0,25 kilos ni siquiera hacía falta. Lo vamos a usar recién para la energía.`]
});

S({title:'Resolvemos el sistema',
html:`
${Q(90,180,'y:  v_b′ sen30° = v_1′ sen60°',0,'s')}
${Q(90,250,`v_b′ = v_1′ ${fr('sen60°','sen30°')} = ${rt('3')} v_1′`,1,'s')}
${Q(90,345,`x:  8 = ${rt('3')} v_1′ · ${fr(rt('3'),'2')} + v_1′ · ${fr('1','2')}`,2,'s')}
${Q(90,445,'8 = 1,5 v_1′ + 0,5 v_1′ = 2 v_1′',3,'s')}
${Q(700,200,'v_1′ = 4,00 [m/s]',4,'l box')}
${Q(700,320,'v_b′ = 4 ' + rt('3') + ' = 6,93 [m/s]',5,'l box')}
${N(700,450,500,'sen 60° = √3/2 , sen 30° = 1/2 , cos 30° = √3/2 , cos 60° = 1/2',2)}`,
beats:[
`Resolvemos. Partimos por la ecuación y, que es la más simple. Pasamos el término negativo al otro lado: v b prima seno 30, igual a v 1 prima seno 60.`,
`Despejamos v b prima: es v 1 prima por seno 60 dividido por seno 30. Seno 60 es raíz de 3 sobre 2, y seno 30 es un medio. Al dividir, los dos se van, y queda raíz de 3. Entonces v b prima es raíz de 3 por v 1 prima.`,
`Ahora reemplazamos eso en la ecuación x. 8 es igual a raíz de 3 por v 1 prima, por coseno de 30, que es raíz de 3 sobre 2. Más v 1 prima por coseno de 60, que es un medio.`,
`Raíz de 3 por raíz de 3 es 3, y dividido por 2 da 1,5. Entonces: 8 es igual a 1,5 v 1 prima más 0,5 v 1 prima. Eso es 2 v 1 prima.`,
`Despejamos: v 1 prima es 8 dividido por 2, que da 4,00 metros por segundo. La amarilla sale a 4.`,
`Y la blanca: v b prima es raíz de 3 por 4, que da 6,93 metros por segundo. Igual que el resultado de la clase.`]
});

S({title:'Método 2: el triángulo de momentos',
html:`${svg(`
${arr(120,520,620,520,'mom','p'+sb('antes'),0,[370,560])}
${arr(120,520,495,303,'mom','p'+sb('b')+'′',1,[285,385])}

<g data-b="2"><path d="M476 314 L486 331 L503 321" class="ln" style="stroke:var(--acc);stroke-width:2.5"/>${tx(495,270,'90°',null,'smacc')}</g>`)}

${Q(720,530,'v_1′ = 8 sen30° = 4,00 [m/s]',4,'s box')}`,
beats:[
`Método dos, geométrico. El momento de antes es una sola flecha horizontal, la de la blanca. Tamaño: m por 8.`,
`El momento de después es la suma de dos flechas: la de la blanca, que sube a 30 grados, y la de la amarilla, que baja a 60 grados. Si las ponemos una detrás de la otra, la punta de la última tiene que llegar justo a la punta del momento de antes. Se forma un triángulo.`,
`Los ángulos del triángulo: 30 grados abajo a la izquierda, 60 grados abajo a la derecha, y como los tres suman 180, arriba quedan 90 grados. Es un triángulo rectángulo.`,
`Ahora usamos el teorema del seno: cada lado dividido por el seno del ángulo opuesto da lo mismo. El lado de antes, m v b, está frente al ángulo de 90. El de la blanca está frente al de 60. Y el de la amarilla frente al de 30.`,
`Como seno de 90 es 1, queda directo: v b prima es 8 por seno de 60, 6,93. Y v 1 prima es 8 por seno de 30, 4,00. Los mismos resultados, con menos álgebra. Usa el método que te resulte más cómodo.`]
});

S({title:'¿Es elástica esta colisión?',
html:`
${Q(90,190,`K_{antes} = ${fr('1','2')} · 0,25 · 8^2 = 8 [J]`,0,'s')}
${Q(90,290,`K_{después} = ${fr('1','2')} · 0,25 · 6,93^2 + ${fr('1','2')} · 0,25 · 4^2`,1,'s')}

${Q(90,470,'K_{antes} = K_{después}  ⇒  {{elástica}}',3,'l box')}
${N(720,190,500,'Dato: dos masas <b>iguales</b>, una en reposo, choque <b>elástico</b> → salen formando <b>90°</b> entre ellas.',4,'acc')}`,
beats:[
`Ahora sí usamos la masa, para la energía. Antes: un medio por 0,25 por 8 al cuadrado. 8 al cuadrado es 64, por 0,25 es 16, y la mitad es 8 joule.`,
`Después: un medio por 0,25 por 6,93 al cuadrado, más un medio por 0,25 por 4 al cuadrado.`,
`6,93 al cuadrado es 48, por 0,25 es 12, la mitad es 6 joule. Y 4 al cuadrado es 16, por 0,25 es 4, la mitad es 2 joule. Total después: 8 joule.`,
`La energía cinética antes es igual a la de después: la colisión es elástica.`,
`Un dato que te sirve para revisar: cuando dos masas iguales chocan de forma elástica, y una estaba en reposo, siempre salen formando un ángulo de 90 grados entre ellas. Aquí: 30 más 60, 90. Calza perfecto.`]
});

S({title:'La ecuación en y',
html:`
${Q(90,180,'{{antes:}} p_y = 0',0,'s')}

beats:[
`Partimos por el eje y, porque tiene una sola incógnita. Antes del choque, la camioneta iba en línea recta en x, y el compacto estaba quieto. El momento en y antes es cero.`,
`Después: la camioneta aporta 2 m por v c por seno de 30, hacia arriba, positivo. El compacto aporta m por 70 por seno de 40, hacia abajo, negativo. La suma tiene que dar cero.`,
`Pasamos el término negativo al otro lado: 2 m v c seno 30 igual a m por 70 seno 40.`,

beats:[

`Ven una araña venenosa en el piso del trineo y saltan hacia afuera al mismo tiempo. Luis salta hacia la izquierda, a 5,00 metros por segundo, con un ángulo de 30 grados sobre la horizontal. Karen salta hacia la derecha, a 5,54 metros por segundo, con 36,9 grados sobre la horizontal.`,
`Ojo: nos dan pesos, en newton, no masas. Para tener la masa hay que dividir el peso por g. Pero ya vas a ver que en este problema g se cancela.`,
`Nos piden la velocidad del trineo después de los saltos, considerando que la horizontal es la dirección en que se mueve el trineo. Y la clase agrega una pregunta: ¿qué pasa con la componente vertical del momento?`]
});

S({title:'Conservación en el eje horizontal',
html:`
${Q(90,180,`m = ${fr('P','g')} :  m_L = 80 ,  m_K = 60 ,  m_t = 100 [kg]`,0,'s')}
${Q(90,270,'v_{Lx} = −5,00 cos30° = −4,33 [m/s]',1,'s')}
${Q(90,330,'v_{Kx} = +5,54 cos36,9° = +4,43 [m/s]',1,'s')}
${Q(90,420,'0 = 80 (−4,33) + 60 (4,43) + 100 v_t',2,'s')}
${Q(90,490,'0 = −346,4 + 265,8 + 100 v_t',3,'s')}
${Q(90,580,`v_t = ${fr('80,6','100')} = +0,81 [m/s]`,4,'l box')}
${N(800,580,420,'Hacia la <b>derecha</b>, del lado de Karen.',4)}`,
beats:[
`Primero las masas: peso dividido por g. Con g igual a 10: Luis tiene 80 kilos, Karen 60 y el trineo 100.`,
`Ahora las componentes horizontales de las velocidades. Hacia la derecha es positivo. Luis va hacia la izquierda: menos 5 por coseno de 30, que da menos 4,33 metros por segundo. Karen va hacia la derecha: 5,54 por coseno de 36,9, que da más 4,43.`,
`Al principio todo está quieto, así que el momento horizontal total es cero. Como el hielo no tiene roce, no hay fuerzas horizontales externas, y el momento horizontal se conserva. Después de los saltos: 80 por menos 4,33, más 60 por 4,43, más 100 por la velocidad del trineo, tiene que dar cero.`,
`Multiplicamos: Luis aporta menos 346,4, y Karen más 265,8.`,
`Juntamos: menos 80,6 más 100 v t igual a cero. Entonces v t es 80,6 dividido por 100: más 0,81 metros por segundo. Luis empujó más fuerte hacia la izquierda, así que el trineo se va hacia la derecha.`]
});

S({title:'¿Y la componente vertical?',
html:`
${Q(90,180,'{{antes:}} p_y = 0',0,'s')}
${Q(90,250,'{{Luis:}} 80 · 5,00 sen30° = 200 [kg·m/s] {{hacia arriba}}',1,'s')}
${Q(90,315,'{{Karen:}} 60 · 5,54 sen36,9° ≈ 200 [kg·m/s] {{hacia arriba}}',1,'s')}
${Q(90,390,'{{después:}} p_y ≈ 400 [kg·m/s] ≠ 0',2,'s acc')}
${N(90,470,1100,'Al saltar empujan el trineo hacia abajo y <b>el hielo empuja hacia arriba</b> con una normal mayor que los pesos. Es una fuerza <b>externa vertical</b>: por eso <i>p<sub>y</sub></i> no se conserva.',3)}
${N(90,600,1100,'Nota: la diapositiva da como respuesta 6,12 m/s. Con los datos del enunciado la cuenta da 0,81 m/s. Conviene confirmarlo con tu ayudante.',4,'acc')}`,
beats:[
`Ahora la pregunta de la clase: ¿qué ocurre con la componente vertical del momento? Antes de saltar, nada se mueve en vertical: el momento vertical es cero.`,
`Después del salto, los dos van hacia arriba. Luis: 80 por 5 por seno de 30, que da 200. Karen: 60 por 5,54 por seno de 36,9, que da unos 200 también.`,
`El momento vertical después es unos 400 kilogramo metro por segundo hacia arriba. No es cero. El momento vertical no se conservó.`,
`¿Por qué? Porque para saltar, Luis y Karen empujan el trineo hacia abajo, y el hielo responde empujando hacia arriba con una normal mucho más grande que los pesos. Esa normal es una fuerza externa, y es vertical. Por eso solo podemos conservar el momento horizontal. Es la idea dos del capítulo de conservación.`,
`Una advertencia: en la diapositiva la respuesta aparece como 6,12 metros por segundo. Pero haciendo la cuenta con los datos del enunciado da 0,81 metros por segundo, y la revisamos dos veces. Puede ser un error de tipeo en la diapositiva. Te conviene confirmarlo con tu ayudante, pero el método es exactamente este.`]
});

S({title:'c) Rapidez justo antes de caer',
html:`
${Q(90,180,'v_x = 2,4 [m/s]  {{(no cambia)}}',0,'s')}
${Q(90,250,'v_y^2 = v_{y0}^2 + 2 g Δy = 1,8^2 + 2 · 10 · 4,0',1,'s')}
${Q(90,320,'v_y^2 = 3,24 + 80 = 83,24  ⇒  v_y = −9,12 [m/s]',1,'s')}
${Q(90,400,`v = ${rt('2,4^2 + 9,12^2')} = ${rt('89')} = 9,43 [m/s]`,2,'l box')}
${N(90,520,520,'<b>Otra forma, con energía:</b>',3)}
${Q(90,580,`${fr('1','2')} m v^2 = ${fr('1','2')} m · 3^2 + m g · 4  ⇒  v^2 = 9 + 80 = 89`,3,'s')}`,
beats:[
`Pregunta c. Justo antes de caer en el carrito, la componente horizontal sigue siendo 2,4 metros por segundo.`,
`Para la vertical usamos la ecuación de cinemática sin tiempo: v y al cuadrado es v y inicial al cuadrado, más 2 g por la distancia que baja. 1,8 al cuadrado es 3,24, y 2 por 10 por 4 es 80. Total 83,24. La raíz da 9,12, hacia abajo.`,
`La rapidez es el tamaño del vector: raíz de 2,4 al cuadrado más 9,12 al cuadrado. Eso es raíz de 89, que da 9,43 metros por segundo.`,
`Hay otra forma más corta, con energía, porque durante la caída solo actúa el peso. La energía cinética abajo es la de arriba más la potencial que pierde: un medio m v al cuadrado, igual a un medio m por 3 al cuadrado, más m g por 4. Las m se cancelan, multiplicamos por 2, y v al cuadrado es 9 más 80, 89. El mismo resultado.`]
});

html:`${svg(`

${cbox(160,300,46,46,'A','',0)}${arr(206,323,296,323,'vel','2,4',0,[250,300])}${arr(183,346,183,440,'vel','9,12',0,[230,420])}

`En y no se conserva. El paquete venía bajando a 9 metros por segundo y se detiene en vertical de golpe. Lo frena el fondo del carrito, que a su vez es empujado por el suelo con una normal enorme. Esa normal es externa. Por eso solo usamos x.`]

S({title:'b) La velocidad final',

S({title:'El enunciado',
html:`${svg(`
${gnd(80,1200,600,0)}
${cir(330,450,150,0)}
${dot(330,450,0,4)}${dim(330,450,330,300,'R',0,352,375)}
